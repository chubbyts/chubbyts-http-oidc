allowBuilds:
  cpu-features: false
  protobufjs: false
  ssh2: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@chubbyts/chubbyts-http-types@4.0.0'
  - '@chubbyts/chubbyts-http@3.0.0'
  - '@chubbyts/chubbyts-dic-config-factory@1.1.0'
  - '@chubbyts/chubbyts-dic-config@2.4.0'
  - '@chubbyts/chubbyts-dic-types@2.4.0'
  - '@chubbyts/chubbyts-dic@2.4.1'
  - '@chubbyts/chubbyts-function-mock@2.4.0'
  - '@chubbyts/chubbyts-log-types@3.4.0'
packageExtensions:
  '@stryker-mutator/core':
    dependencies:
      typescript: ^6.0.3
